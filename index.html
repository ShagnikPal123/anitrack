<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AniTrack — Anime, Manga & Light Novel Tracker</title>
<meta name="description" content="AniTrack is a personal anime, manga and light novel tracker with franchise linking, smart suggestions, release calendar, statistics and full theme customization.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="side-logo">
      <div class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 5.5C4 4.1 5.1 3 6.5 3h7L21 10.5c.6.6.6 1.5 0 2.1L10.6 21H6.5C5.1 21 4 19.9 4 18.5v-13Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M13.5 3v7.5H21" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </div>
      <span class="logo-text">AniTrack</span>
    </div>
    <button id="profile-btn" class="profile-btn" title="Switch profile">
      <span class="avatar" id="profile-avatar">S</span>
      <span class="profile-name" id="profile-name">Profile</span>
      <svg viewBox="0 0 24 24" fill="none" width="14" height="14"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <nav id="nav" aria-label="Main">
      <button class="nav-item active" data-tab="home"><span class="nav-ico"></span><span>Home</span></button>
      <button class="nav-item" data-tab="anime"><span class="nav-ico"></span><span>Anime</span></button>
      <button class="nav-item" data-tab="manga"><span class="nav-ico"></span><span>Manga</span></button>
      <button class="nav-item" data-tab="ln"><span class="nav-ico"></span><span>Light Novels</span></button>
      <button class="nav-item" data-tab="franchise"><span class="nav-ico"></span><span>Franchise</span></button>
      <button class="nav-item" data-tab="suggestions"><span class="nav-ico"></span><span>Suggestions</span></button>
      <button class="nav-item" data-tab="calendar"><span class="nav-ico"></span><span>Calendar</span></button>
      <button class="nav-item" data-tab="statistics"><span class="nav-ico"></span><span>Statistics</span></button>
      <button class="nav-item" data-tab="links"><span class="nav-ico"></span><span>Links</span></button>
      <button class="nav-item" data-tab="aichat"><span class="nav-ico"></span><span>AI Chat</span></button>
      <button class="nav-item" data-tab="settings"><span class="nav-ico"></span><span>Settings</span></button>
    </nav>
    <div class="side-foot">
      <div class="local-note" title="Profiles live only in this browser's local storage">Device-local profiles</div>
    </div>
  </aside>

  <div id="main">
    <header id="topbar">
      <div class="greet-wrap">
        <h1 id="greeting">Good Morning</h1>
        <p id="greeting-sub">Let's track something today</p>
      </div>
      <div class="top-actions">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" width="16" height="16"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="global-search" type="text" placeholder="Search your library…  ( / )" autocomplete="off">
          <div id="search-results" class="search-results hidden"></div>
        </div>
        <button id="bell" class="icon-btn" title="Today's releases">
          <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M18 8a6 6 0 10-12 0c0 7-3 8-3 8h18s-3-1-3-8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.3 21a2 2 0 003.4 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span id="bell-count" class="bell-count hidden">0</span>
        </button>
      </div>
    </header>

    <main id="content">
      <section class="tab active" id="tab-home"><div id="home-view"></div></section>
      <section class="tab" id="tab-anime"><div id="media-anime"></div></section>
      <section class="tab" id="tab-manga"><div id="media-manga"></div></section>
      <section class="tab" id="tab-ln"><div id="media-ln"></div></section>
      <section class="tab" id="tab-franchise"><div id="franchise-view"></div></section>
      <section class="tab" id="tab-suggestions"><div id="sugg-view"></div></section>
      <section class="tab" id="tab-calendar"><div id="cal-view"></div></section>
      <section class="tab" id="tab-statistics"><div id="stats-view"></div></section>
      <section class="tab" id="tab-links"><div id="links-view"></div></section>
      <section class="tab" id="tab-aichat"><div id="chat-view"></div></section>
      <section class="tab" id="tab-settings"><div id="settings-view"></div></section>
    </main>
  </div>
</div>

<button id="fab-add" title="Add titles (+)">
  <svg viewBox="0 0 24 24" fill="none" width="26" height="26"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
</button>

<div id="modal-backdrop" class="hidden"></div>
<div id="modal-add" class="modal hidden" role="dialog" aria-modal="true" aria-label="Add titles">
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="add-title">Add to library</h2>
      <button class="icon-btn modal-close" data-close="modal-add" aria-label="Close">✕</button>
    </div>
    <div id="add-step-search">
      <input id="add-search" type="text" placeholder="Search AniList… e.g. Frieren" autocomplete="off">
      <div id="add-kind-row" class="kind-row"></div>
      <div id="add-results" class="add-results"></div>
      <div class="modal-foot">
        <span id="add-count" class="muted"></span>
        <button id="add-selected" class="btn-primary" disabled>Add selected</button>
      </div>
    </div>
    <div id="add-step-related" class="hidden">
      <h3>Also add related media?</h3>
      <p class="muted">Found these from the same source / adaptations on AniList:</p>
      <div id="related-list" class="add-results"></div>
      <div class="modal-foot">
        <button id="related-skip" class="btn-ghost">Skip</button>
        <button id="related-add" class="btn-primary">Add selected</button>
      </div>
    </div>
  </div>
</div>

<div id="drawer" class="drawer hidden" role="dialog" aria-modal="true" aria-label="Entry details">
  <div class="drawer-card" id="drawer-card"></div>
</div>

<div id="modal-generic" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-card small" id="generic-card"></div>
</div>

<div id="toasts" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
